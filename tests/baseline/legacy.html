.btn{border-radius:10px;padding:9px 16px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;
  gap:7px;transition:.12s;white-space:nowrap}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy2)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#b8911f);color:#231900}
.btn-gold:hover{filter:brightness(1.05)}
.btn-ghost{border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn-ghost:hover{background:var(--bg)}
.btn-ai{background:linear-gradient(135deg,#2f6dd0,#1e56b0);color:#fff}
.btn-ai:hover{filter:brightness(1.08)}

/* ---------- project header band ---------- */
.proj-band{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
  display:flex;align-items:center;gap:18px;box-shadow:var(--shadow);margin-bottom:18px}
.proj-thumb{width:96px;height:66px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#cbd5e6}
.proj-head-main{display:flex;align-items:center;gap:10px}
.proj-head-main .pid{font-size:20px;font-weight:800}
.proj-head-main .pname{font-size:16px;color:var(--muted);font-weight:500}
.proj-metrics{display:flex;gap:26px;flex-wrap:wrap;margin-top:8px}
.pm-item .pm-l{font-size:10.5px;color:var(--muted);font-weight:600}
.pm-item .pm-v{font-size:14px;font-weight:700;margin-top:1px}

.grid{display:grid;gap:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;

.kpi.click{cursor:pointer}
.kpi.click:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(16,27,45,.1)}
.kpi-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kpi-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-l{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.2}
.kpi-v{font-size:23px;font-weight:800;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:15px 18px 0;display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:14.5px;font-weight:700}
.card-b{padding:16px 18px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;
  white-space:nowrap;transition:.12s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--navy2);border-bottom-color:var(--navy2)}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:#F7F9FC;text-align:left;padding:11px 13px;font-size:11px;font-weight:700;color:var(--muted);
  border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 13px;border-bottom:1px solid #eef1f6;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer;transition:background .1s}
tbody tr.click:hover{background:#F7F9FC}
tbody tr.sel{background:var(--blue-bg)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--navy2)}
.tid{color:var(--blue);font-weight:700}
.tbl-total td{background:#F7F9FC;font-weight:700}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-grey{background:#eef1f6;color:var(--muted)}
.pill{padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600}

/* ---------- progress ---------- */
.prog{height:6px;background:#eef1f6;border-radius:4px;overflow:hidden;min-width:70px}
.prog span{display:block;height:100%;border-radius:4px}

/* ---------- filters ---------- */
.filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.ffield{display:flex;flex-direction:column;gap:3px}
.ffield label{font-size:10px;color:var(--muted);font-weight:600;padding-left:2px}
.ffield select,.ffield input{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--card);min-width:120px}
.ffield select:focus,.ffield input:focus{outline:none;border-color:var(--navy2)}
.search{position:relative;flex:1;min-width:180px}
.search input{width:100%;padding-left:34px}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* ---------- drawer ---------- */

.drawer{position:fixed;top:0;right:0;height:100vh;width:420px;background:var(--card);z-index:41;

@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-h .dh-id{font-size:17px;font-weight:800}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px}
.drawer-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:16px}
.kv .kv-l{font-size:10.5px;color:var(--muted);font-weight:600}
.kv .kv-v{font-size:13px;font-weight:600;margin-top:2px}
.doc-link{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);

.modal.wide{max-width:920px}

.modal-h h2{font-size:17px;font-weight:750}
.modal-b{padding:20px 22px;overflow-y:auto}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:11.5px;font-weight:600;color:var(--ink)}

.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:11px;

.toast.info{border-left-color:var(--blue)}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast .tt{font-weight:700;font-size:13px}
.toast .ts{font-size:11.5px;color:var(--muted)}

.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}
.link{color:var(--blue);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.chip{padding:3px 10px;border-radius:7px;font-size:11.5px;font-weight:600;background:var(--bg);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fade-up{animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pagination{display:flex;align-items:center;gap:5px}
.pg{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px}
.pg.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.donut-legend{display:flex;flex-direction:column;gap:9px}
.dl-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px}
.mini-tt{position:relative;display:inline-flex;cursor:help;border-bottom:1px dotted var(--muted)}
.mini-tt .tip{visibility:hidden;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);

.matrix .cell{aspect-ratio:1.5;border-radius:6px;display:flex;align-items:center;justify-content:center;

function Donut({data, total, label, size}){

// line chart (SVG) — series: [{name,color,pts:[y...],dash}]

  const max=yMax|| Math.max(...series.flatMap(s=>s.pts.filter(v=>v!=null)))*1.1;
  const xstep=plotW/(labels.length-1);
  const X=i=>pad+i*xstep, Y=v=>ht-24-(v/max)*plotH;
  return h('svg',{viewBox:`0 0 ${w} ${ht}`,width:'100%',style:{overflow:'visible'}},
    [0,.25,.5,.75,1].map((f,i)=>h('g',{key:i},
      h('line',{x1:pad,x2:w-14,y1:Y(max*f),y2:Y(max*f),stroke:'#eef1f6'}),
      h('text',{x:pad-6,y:Y(max*f)+3,'textAnchor':'end',fontSize:9,fill:'#9aa7bd'},
        isMoney? mn(max*f): (max*f).toFixed(max<=2?2:0)))),
    labels.map((l,i)=> i%1===0 && h('text',{key:i,x:X(i),y:ht-6,'textAnchor':'middle',fontSize:9,fill:'#9aa7bd'}, l)),
    series.map((s,si)=>{

}
// bar chart grouped — groups:[{label, bars:[{v,color}]}]
function BarChart({groups, h:ht, yMax, money:isMoney}){
  ht=ht||220; const w=560, pad=40, plotW=w-pad-14, plotH=ht-34;
  const max=yMax|| Math.max(...groups.flatMap(g=>g.bars.map(b=>b.v)))*1.12;

    [0,.25,.5,.75,1].map((f,i)=>h('g',{key:i},

// ============================================================ AI ASSISTANT drawer
function AIAssistant({scope, onClose}){
  const [msgs,setMsgs]=useState([{role:'ai',text:"Hi! I'm your PMO Assistant. Ask me about budget, risks, variances, or project status across the portfolio."}]);
  const [q,setQ]=useState('');
  const suggested=['Which projects are over AFC?','Summarise portfolio risk exposure','What variations are pending approval?','Show me the worst SPI project'];
  const answer=(text)=>{
    const list=scoped(scope),a=agg(list);
    let ans='';
    if(/afc|over|budget/i.test(text)) ans=`Across ${a.count} in-scope projects, the total Approved Budget is ${money(a.budget)} and AFC is ${money(a.afc)} — a favorable variance of ${money(a.variance)}. RES-02 Rimal Heights is the closest to its budget ceiling (AFC ${money(970000000)} vs budget ${money(980000000)}).`;
    else if(/risk|exposure/i.test(text)) ans=`Total risk exposure (EMV) in scope is ${money(a.emv)}. There are ${a.highRisks} high-severity risks. The largest single exposure is "Delay in Material Supply" on RES-01 at ${money(8500000)}.`;
    else if(/variation|pending|approval/i.test(text)) ans=`There are 2 variations under review on RES-01: VO-014 (MEP Design Change, SAR 1.2M) and VO-011 (Additional Steel Rebar, SAR 1.65M). Approved variations this project total SAR 13.15M.`;
    else if(/spi|worst|schedule/i.test(text)) ans=`The lowest SPI in scope is RES-02 Rimal Heights at 0.78 (behind schedule). LND-02 follows at 0.87 and is flagged Delayed. All others are above 0.88.`;
    else ans=`In scope: ${a.count} projects, Approved Budget ${money(a.budget)}, AFC ${money(a.afc)}, Budget Variance ${money(a.variance)} (favorable), avg SPI ${a.spi.toFixed(2)}, avg CPI ${a.cpi.toFixed(2)}. ${a.onTrack} on track, ${a.atRisk} at risk, ${a.delayed} delayed.`;
    return ans;
  };
  const ask=(text)=>{if(!text.trim())return; setMsgs(m=>[...m,{role:'user',text},{role:'ai',text:answer(text)}]); setQ('');};
  return h('div',null,
    h('div',{className:'drawer-scrim',onClick:onClose}),
    h('div',{className:'drawer',style:{width:440}},
      h('div',{className:'drawer-h'},
        h('div',{className:'row',style:{gap:10}},
          h('div',{className:'kpi-ic',style:{width:34,height:34,background:'linear-gradient(135deg,#2f6dd0,#1e56b0)'}},Ic('ai',18,'#fff')),
          h('div',null,h('div',{className:'dh-id',style:{fontSize:15}},'PMO Assistant'),
            h('div',{className:'muted',style:{fontSize:11}},'AI · '+scope.level+' scope'))),
        h('button',{className:'icon-btn',style:{width:32,height:32},onClick:onClose},Ic('x',17))),
      h('div',{className:'drawer-b',style:{display:'flex',flexDirection:'column',gap:12}},
        msgs.map((m,i)=>h('div',{key:i,style:{alignSelf:m.role==='user'?'flex-end':'flex-start',maxWidth:'85%'}},
          h('div',{style:{padding:'10px 13px',borderRadius:12,fontSize:12.5,lineHeight:1.55,
            background:m.role==='user'?'var(--navy)':'var(--bg)',color:m.role==='user'?'#fff':'var(--ink)',
            border:m.role==='ai'?'1px solid var(--line)':'none'}},m.text))),
        msgs.length<=1&&h('div',{style:{marginTop:8}},
          h('div',{className:'muted',style:{fontSize:11,marginBottom:8,fontWeight:600}},'SUGGESTED QUESTIONS'),
          suggested.map((s,i)=>h('div',{key:i,className:'doc-link',style:{color:'var(--ink)'},onClick:()=>ask(s)},
            h('span',{className:'row',style:{gap:8}},Ic('ai',14,'#2F6DD0'),s),Ic('chevR',14))))),
      h('div',{className:'drawer-f'},
        h('input',{value:q,onChange:e=>setQ(e.target.value),onKeyDown:e=>e.key==='Enter'&&ask(q),
          placeholder:'Ask about your portfolio...',style:{flex:1,border:'1px solid var(--line)',borderRadius:10,padding:'10px 12px'}}),
        h('button',{className:'btn btn-ai',onClick:()=>ask(q)},Ic('send',15)))));
